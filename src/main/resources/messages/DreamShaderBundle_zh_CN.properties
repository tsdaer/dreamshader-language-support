welcome.section.features.title=功能亮点
welcome.section.features.html=<ul><li><b>语言核心：</b>支持 <code>.dsm</code>/<code>.dsf</code>/<code>.dsh</code> 文件、lexer/parser/PSI、符号模型、代码折叠、结构视图，以及 formatter/commenter/brace matching。</li><li><b>智能编辑：</b>提供 sections/types/settings/UE.* 与 imports 的上下文补全，以及悬浮文档、签名帮助、查找用法、引用与跳转定义。</li><li><b>诊断能力：</b>包含语法 + section-shape + 语义分析、Bridge 诊断映射、参数内联提示与 Code Vision 提示。</li><li><b>工具链：</b>提供 DreamShader Hub、Bridge 面板与操作、包商店全生命周期管理，以及材质/函数/头文件/包脚手架模板。</li></ul>
welcome.section.howTo.title=使用方法
welcome.section.howTo.html=<ul><li>打开 <b>Tools | DreamShader | Open DreamShader Hub</b> 进入一站式入口。</li><li>在 <b>Settings | Tools | DreamShader</b> 配置项目行为（项目根目录、manifest 路径、Bridge 命令、导入扩展偏好、悬浮覆盖）。</li><li>在 <b>Tools | DreamShader | DreamShader Packages</b> 管理包：浏览、安装、更新、移除。</li><li>在 <b>Tools | DreamShader | DreamShader Templates</b> 快速创建材质/函数/头文件/包脚手架。</li></ul>
welcome.section.setup.title=建议先完成设置
welcome.section.setup.html=<p>开始使用前，建议先在 <b>Settings | Tools | DreamShader</b> 完成关键配置，重点包括项目根目录、Bridge 命令和悬浮文档覆盖。</p><p><a href="dreamshader://open-settings">打开 DreamShader 设置</a></p>
welcome.section.changes.title=本版本变动
welcome.section.changes.versionLine=v{0} -> v{1}
welcome.section.changes.fallback=<p>当前构建未打包变更说明。</p><p>可查看仓库变更日志：<a href="https://github.com/tsdaer/dreamshader-language-support/blob/main/CHANGELOG.md">CHANGELOG.md</a></p>
