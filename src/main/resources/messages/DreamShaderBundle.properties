welcome.section.features.title=Feature Highlights
welcome.section.features.html=<ul><li><b>Language Core:</b> <code>.dsm</code>/<code>.dsf</code>/<code>.dsh</code> file support, lexer/parser/PSI, symbols, folding, structure view, and formatter/commenter/brace matching.</li><li><b>Smart Editing:</b> context-aware completion for sections/types/settings/UE.* and imports, plus hover docs, signature help, find usages, references, and go-to declaration.</li><li><b>Diagnostics:</b> syntax + section-shape + semantic analysis, Bridge diagnostics mapping, inlay parameter hints, and Code Vision hints.</li><li><b>Tooling:</b> DreamShader Hub, Bridge panel/actions, package store lifecycle management, and material/function/header/package scaffold templates.</li></ul>
welcome.section.howTo.title=How To Use
welcome.section.howTo.html=<ul><li>Open <b>Tools | DreamShader | Open DreamShader Hub</b> for one-stop entry.</li><li>Configure project behavior in <b>Settings | Tools | DreamShader</b> (project root, manifest path, Bridge commands, import extension preference, hover overrides).</li><li>Manage packages in <b>Tools | DreamShader | DreamShader Packages</b> to browse, install, update, and remove packages.</li><li>Create starter files under <b>Tools | DreamShader | DreamShader Templates</b> for material/function/header/package scaffolds.</li></ul>
welcome.section.setup.title=Recommended Setup
welcome.section.setup.html=<p>Before starting, configure key options in <b>Settings | Tools | DreamShader</b>, especially project root, Bridge commands, and hover docs overrides.</p><p><a href="dreamshader://open-settings">Open DreamShader Settings</a></p>
welcome.section.changes.title=What Changed In This Version
welcome.section.changes.versionLine=v{0} -> v{1}
welcome.section.changes.fallback=<p>No packaged change notes were found for this build.</p><p>Open the repository changelog: <a href="https://github.com/tsdaer/dreamshader-language-support/blob/main/CHANGELOG.md">CHANGELOG.md</a></p>
