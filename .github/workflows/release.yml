# GitHub Actions Workflow created for handling the release process based on the draft release prepared with the Build workflow.
# Running the publishPlugin task requires all the following secrets to be provided:
# JETBRAINS_PUBLISH_TOKEN (or PUBLISH_TOKEN), JETBRAINS_PRIVATE_KEY_PASSWORD (or PRIVATE_KEY_PASSWORD),
# and one of each signing secret pair:
# - JETBRAINS_CERTIFICATE_CHAIN or CERTIFICATE_CHAIN
# - JETBRAINS_PRIVATE_KEY or PRIVATE_KEY
# See https://plugins.jetbrains.com/docs/intellij/plugin-signing.html for more information.

name: Release
on:
  release:
    types: [ prereleased, released ]

jobs:

  # Prepare and publish the plugin to JetBrains Marketplace repository
  release:
    name: Publish Plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:

      # Free GitHub Actions Environment Disk Space
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      # Check out the current repository
      - name: Fetch Sources
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      # Set up the Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
          cache-disabled: true

      # Publish the plugin to JetBrains Marketplace
      - name: Publish Plugin
        env:
          ORG_GRADLE_CONFIGURATION_CACHE: "false"
          JETBRAINS_PUBLISH_TOKEN: ${{ secrets.JETBRAINS_PUBLISH_TOKEN || secrets.PUBLISH_TOKEN }}
          JETBRAINS_PRIVATE_KEY_PASSWORD: ${{ secrets.JETBRAINS_PRIVATE_KEY_PASSWORD || secrets.PRIVATE_KEY_PASSWORD }}
          CERTIFICATE_CHAIN: ${{ secrets.JETBRAINS_CERTIFICATE_CHAIN || secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.JETBRAINS_PRIVATE_KEY || secrets.PRIVATE_KEY }}
        run: |
          CERT_FILE="$RUNNER_TEMP/jetbrains-chain.crt"
          KEY_FILE="$RUNNER_TEMP/jetbrains-private.pem"

          printf '%s' "$CERTIFICATE_CHAIN" > "$CERT_FILE"
          printf '%s' "$PRIVATE_KEY" > "$KEY_FILE"

          export JETBRAINS_CERTIFICATE_CHAIN_FILE="$CERT_FILE"
          export JETBRAINS_PRIVATE_KEY_FILE="$KEY_FILE"

          ./gradlew publishPlugin --no-configuration-cache

      # Upload an artifact as a release asset
      - name: Upload Release Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.event.release.tag_name }} ./build/distributions/* --clobber
